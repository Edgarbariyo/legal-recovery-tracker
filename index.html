<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Legal Recovery Tracker — Stanbic Recoveries</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --navy-deep: #0c2340;
  --navy-mid: #163b63;
  --navy-pale: #eef2f7;
  --gold: #c9962e;
  --gold-pale: #f3e3c0;
  --ink: #1a1f29;
  --muted: #5b6472;
  --line: #d9dee6;
  --bg: #f6f7f9;
  --white: #ffffff;
  --red: #a23b34;
  --green: #3e7d59;
  --amber: #b8862e;

  --serif: "Source Serif 4", "Georgia", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "IBM Plex Mono", "Courier New", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 12.5px;
  line-height: 1.5;
}

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; }

a { color: var(--navy-mid); }

/* ---------- Layout shell ---------- */
#app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  background: var(--navy-deep);
  color: var(--white);
  padding: 0 28px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--gold);
}

.topbar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-badge {
  height: 28px;
  width: 28px;
  object-fit: cover;
  border-radius: 6px;
  flex-shrink: 0;
}

.topbar .brand .mark {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.2px;
}

.topbar .brand .sub {
  font-size: 12px;
  color: var(--gold-pale);
  letter-spacing: 0.6px;
  text-transform: uppercase;
  border-left: 1px solid rgba(255,255,255,0.25);
  padding-left: 10px;
}

.topbar .who {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13px;
  color: var(--gold-pale);
}

.topbar .who button {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: var(--white);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 12px;
}
.topbar .who button:hover { background: rgba(255,255,255,0.08); }

main { flex: 1; padding: 24px 28px 60px; width: 100%; }

/* ---------- Login screen ---------- */
.login-screen {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--navy-deep);
  background-image: linear-gradient(165deg, var(--navy-deep) 0%, #081729 100%);
}

.login-card {
  background: var(--white);
  width: 380px;
  padding: 36px 32px 30px;
  border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  position: relative;
}

.login-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--gold);
  border-radius: 6px 6px 0 0;
}

.login-brand-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}
.login-brand-badge { width: 40px; height: 40px; flex-shrink: 0; object-fit: contain; }
.login-brand-text .bank-name { font-weight: 700; color: var(--navy-deep); font-size: 15px; }
.login-brand-text .bank-dept { font-size: 12px; color: var(--muted); margin-top: 1px; }
.login-card .docket-no {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  margin-bottom: 18px;
}

.login-card h1 {
  font-family: var(--serif);
  font-size: 19px;
  margin: 0 0 4px;
  color: var(--navy-deep);
}
.login-card p.tag { color: var(--muted); margin: 0 0 26px; font-size: 13px; }

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--navy-mid);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--white);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--gold);
  outline-offset: 0;
  border-color: var(--gold);
}
.field textarea { resize: vertical; min-height: 70px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: 4px;
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 13px;
}
.btn-primary { background: var(--navy-deep); color: var(--white); }
.btn-primary:hover { background: var(--navy-mid); }
.btn-gold { background: var(--gold); color: var(--navy-deep); }
.btn-gold:hover { background: #d9a93f; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { background: var(--navy-pale); }
.btn-block { width: 100%; }
.btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: #fbeceb; }

.error-msg {
  background: #fbeceb;
  color: var(--red);
  border: 1px solid #e6c5c2;
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 12.5px;
  margin-bottom: 14px;
}

/* ---------- Page header ---------- */
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.page-head h2 {
  font-family: var(--serif);
  font-size: 19px;
  margin: 0;
  color: var(--navy-deep);
}
.page-head .eyebrow {
  font-size: 11px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 700;
  margin-bottom: 4px;
}

/* ---------- Stat cards ---------- */
.stat-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 14px 16px 18px;
  position: relative;
  overflow: hidden;
}
.stat-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 4px;
}
.stat-card .n {
  font-family: var(--serif);
  font-size: 21px;
  color: var(--navy-deep);
  line-height: 1;
}
.stat-card .l {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-top: 6px;
}
.stat-card.accent { border-top: 3px solid var(--gold); }
.stat-card.total { border-top: 3px solid var(--navy-deep); }

/* ---------- Toolbar ---------- */
.toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.toolbar input[type="search"], .toolbar select {
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--white);
}
.toolbar input[type="search"] { min-width: 220px; }
.toolbar .spacer { flex: 1; }

/* ---------- Table ---------- */
.table-wrap {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow-x: auto;
  overflow-y: hidden;
}
table { width: 100%; border-collapse: collapse; }

/* Deliberate column widths for the main case table: Citation gets the most
   room since it holds long free text, and short/fixed-format columns
   (Stage, Filing Date, Activity, Next Action) get much less. */
.case-table { table-layout: fixed; }
.case-table th:nth-child(1),  .case-table td:nth-child(1)  { width: 21%; } /* Citation */
.case-table th:nth-child(2),  .case-table td:nth-child(2)  { width: 8%;  } /* Customer Name */
.case-table th:nth-child(3),  .case-table td:nth-child(3)  { width: 10%; white-space: nowrap; } /* Loan Account No. — fixed-length, keep on one line */
.case-table th:nth-child(4),  .case-table td:nth-child(4)  { width: 9%;  } /* Law Firm */
.case-table th:nth-child(5),  .case-table td:nth-child(5)  { width: 6%;  } /* Quantum */
.case-table th:nth-child(6),  .case-table td:nth-child(6)  { width: 6%;  } /* Stage */
.case-table th:nth-child(7),  .case-table td:nth-child(7)  { width: 7%;  } /* Case State */
.case-table th:nth-child(8),  .case-table td:nth-child(8)  { width: 7%;  } /* Counsel */
.case-table th:nth-child(9),  .case-table td:nth-child(9)  { width: 6%;  } /* Filing Date */
.case-table th:nth-child(10), .case-table td:nth-child(10) { width: 6%;  } /* Activity */
.case-table th:nth-child(11), .case-table td:nth-child(11) { width: 6%;  } /* Next Action */
.case-table th:nth-child(12), .case-table td:nth-child(12) { width: 7%;  } /* Entered / Updated By */
.case-table th:nth-child(13), .case-table td:nth-child(13) { width: 70px; } /* row actions, if present */
.case-table td { overflow-wrap: break-word; word-break: break-word; }
thead th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--muted);
  background: var(--navy-pale);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #fafbfc; cursor: pointer; }

.acct {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--navy-mid);
}
.empty-row td {
  text-align: center;
  padding: 40px 10px;
  color: var(--muted);
}

/* ---------- Stage badges ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 100px;
  font-size: 10.5px;
  font-weight: 600;
  white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }

.stage-Pre-Trial { background: #eef2f7; color: var(--navy-mid); }
.stage-Pre-Trial::before { background: var(--navy-mid); }
.stage-Trial { background: #f3e9d6; color: var(--amber); }
.stage-Trial::before { background: var(--amber); }
.stage-Post-Trial { background: #fdeedb; color: #b15c1f; }
.stage-Post-Trial::before { background: #b15c1f; }
.stage-Judged { background: #e6e9f5; color: #3f4a8f; }
.stage-Judged::before { background: #3f4a8f; }
.stage-Execution { background: #f3e3c0; color: var(--gold); }
.stage-Execution::before { background: var(--gold); }
.stage-Archived { background: #e3efe7; color: var(--green); }
.stage-Archived::before { background: var(--green); }

.doc-YES { background: #e3efe7; color: var(--green); }
.doc-YES::before { background: var(--green); }
.doc-NO { background: #fbeceb; color: var(--red); }
.doc-NO::before { background: var(--red); }
.doc-PARTIAL { background: #fdf6e8; color: var(--amber); }
.doc-PARTIAL::before { background: var(--amber); }

.status-pill {
  font-size: 11px;
  color: var(--muted);
}
.status-On-Hold { color: var(--amber); }
.status-Closed { color: var(--green); }
.status-Written-Off { color: var(--red); }

.badge-activity {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
}
.badge-activity-new { background: var(--navy-pale); color: var(--muted); }
.badge-activity-revisited { background: #f3e3c0; color: var(--gold); }
.activity-date { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.who-line { font-size: 12px; color: var(--ink); }
.who-line.who-updated { color: var(--muted); font-size: 11px; margin-top: 2px; }

.row-actions { display: flex; gap: 6px; }
.icon-btn {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 5px 6px;
  cursor: pointer;
  color: var(--navy-mid);
  display: inline-flex;
  align-items: center;
}
.icon-btn:hover { background: var(--navy-pale); }
.icon-btn.danger { color: var(--red); }
.icon-btn.danger:hover { background: #fdecea; }

/* Centered action column (used on the Secured Cases table) */
td.actions-cell, th.actions-cell { width: 90px; text-align: center; }
td.actions-cell .row-actions { justify-content: center; }

/* ---------- Modal / drawer ---------- */
.overlay {
  position: fixed; inset: 0;
  background: rgba(10,20,35,0.5);
  display: flex;
  align-items: stretch;
  justify-content: flex-end;
  z-index: 50;
}
.overlay.center { align-items: center; justify-content: center; }

.drawer {
  background: var(--bg);
  width: 560px;
  max-width: 92vw;
  height: 100%;
  overflow-y: auto;
  box-shadow: -10px 0 40px rgba(0,0,0,0.25);
}
.drawer.drawer-wide { width: 820px; }

.modal-box {
  background: var(--white);
  width: 480px;
  max-width: 92vw;
  border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  max-height: 88vh;
  overflow-y: auto;
}

.drawer-head, .modal-head {
  position: sticky;
  top: 0;
  background: var(--navy-deep);
  color: var(--white);
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--gold);
  z-index: 2;
}
.drawer-head h3, .modal-head h3 {
  font-family: var(--serif);
  font-size: 15px;
  margin: 0;
}
.drawer-head .acct-line, .modal-head .acct-line {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--gold-pale);
  margin-top: 3px;
}
.close-x {
  background: transparent;
  border: none;
  color: var(--white);
  font-size: 20px;
  line-height: 1;
  padding: 2px 6px;
}
.close-x:hover { color: var(--gold); }

.drawer-body, .modal-body { padding: 20px 22px; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 16px;
}
.form-grid .full { grid-column: 1 / -1; }

.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--gold);
  font-weight: 700;
  margin: 22px 0 10px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.section-label:first-child { margin-top: 0; padding-top: 0; border-top: none; }

.case-summary {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 18px;
  margin-bottom: 20px;
}
.case-summary .row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  font-size: 12px;
  border-bottom: 1px dashed var(--line);
}
.case-summary .row:last-child { border-bottom: none; }
.case-summary .row .k { color: var(--muted); }
.case-summary .row .v { font-weight: 600; text-align: right; }

/* ---------- Timeline ---------- */
.timeline { position: relative; padding-left: 26px; }
.timeline::before {
  content: "";
  position: absolute;
  left: 7px; top: 6px; bottom: 6px;
  width: 2px;
  background: var(--line);
}
.tl-item { position: relative; padding-bottom: 22px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot {
  position: absolute;
  left: -26px; top: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--white);
  border: 3px solid var(--navy-mid);
}
.tl-item.is-latest .tl-dot { border-color: var(--gold); background: var(--gold); }
.tl-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tl-stage { font-weight: 700; color: var(--navy-deep); font-size: 12.5px; }
.tl-date { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.tl-outcome { font-size: 13px; margin-top: 4px; }
.tl-next {
  margin-top: 6px;
  font-size: 12px;
  color: var(--amber);
  background: #fdf6e8;
  display: inline-block;
  padding: 3px 8px;
  border-radius: 4px;
}
.tl-remarks { font-size: 12.5px; color: var(--muted); margin-top: 4px; font-style: italic; }
.tl-by { font-size: 11px; color: var(--muted); margin-top: 4px; }

.actions-row { display: flex; gap: 10px; margin-top: 20px; }

footer.foot {
  text-align: center;
  font-size: 11.5px;
  color: var(--muted);
  padding: 18px 0 26px;
}

@media (max-width: 760px) {
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
  main { padding: 16px; }
  .topbar { padding: 0 14px; }
}

</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

function activityBadge(c) {
  const count = c.engagement_count || 0;
  const revisited = count >= 2;
  const label = revisited ? `${count} updates` : (count === 1 ? "Just opened" : "No activity");
  const badgeClass = revisited ? "badge-activity-revisited" : "badge-activity-new";
  const dateLine = c.last_engaged_at ? `<div class="activity-date">${fdate(c.last_engaged_at)}</div>` : "";
  return `<span class="badge-activity ${badgeClass}">${esc(label)}</span>${dateLine}`;
}

function nextActionCell(c) {
  if (!c.next_action_date) return `<span style="color:var(--muted);">—</span>`;
  const today = new Date().toISOString().slice(0, 10);

  const dateHtml = `<span style="${overdue ? "color:var(--red);font-weight:600;" : ""}">${fdate(c.next_action_date)}</span>`;
  const actionHtml = c.next_action ? `<div style="font-size:10.5px;color:var(--muted);margin-top:2px;">${esc(c.next_action)}</div>` : "";
  return dateHtml + actionHtml;
}

function whoBadge(c) {

function csvEscape(val) {
  if (val == null) return "";
  const s = String(val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

// ---------- combined export: each engagement as its own row, with the
// case's other details repeated on every row, distinguished by Engagement # ----------
const ENGAGEMENT_COLUMNS = ["Engagement #", "Engagement Date", "Outcome", "Next Action", "Next Action Date", "Remarks"];

async function exportCasesToCSV(rows) {
  if (!rows || rows.length === 0) { toast("No cases to export with the current filters.", true); return; }

  const caseIds = rows.map(r => r.id);
  const { data: allHistory, error } = await sb
    .from("case_stage_history")
    .select("*")
    .in("case_id", caseIds)
    .order("case_id", { ascending: true })
    .order("date_entered", { ascending: true })
    .order("created_at", { ascending: true });
  if (error) { toast("Could not load engagement history: " + error.message, true); return; }

  const historyByCase = {};
  (allHistory || []).forEach(h => {
    historyByCase[h.case_id] = historyByCase[h.case_id] || [];
    historyByCase[h.case_id].push(h);
  });

  const header = [...EXPORT_COLUMNS.map(c => c.header), ...ENGAGEMENT_COLUMNS].map(csvEscape).join(",");

  const lines = [];
  rows.forEach(c => {
    const entries = historyByCase[c.id] || [];
    if (entries.length === 0) {
      const caseCells = EXPORT_COLUMNS.map(col => csvEscape(c[col.key]));
      lines.push([...caseCells, "", "", "", "", "", ""].join(","));
      return;
    }
    entries.forEach((h, i) => {
      const rowCaseValues = { ...c, case_stage: h.stage, last_updated_by_name: h.logged_by_name, updated_at: h.date_entered };
      const caseCells = EXPORT_COLUMNS.map(col => csvEscape(rowCaseValues[col.key]));
      lines.push([
        ...caseCells,
        csvEscape(i + 1),
        csvEscape(h.date_entered),
        csvEscape(h.outcome),
        csvEscape(h.next_action),
        csvEscape(h.next_action_date),
        csvEscape(h.remarks),
      ].join(","));
    });
  });

  const csv = [header, ...lines].join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `legal_cases_export_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(`Exported ${rows.length} case(s) (${lines.length} rows total) to CSV.`);
}

function toast(msg, isError) {
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.position = "fixed";
  t.style.bottom = "24px";
  t.style.left = "50%";
  t.style.transform = "translateX(-50%)";
  t.style.background = isError ? "#a23b34" : "#0c2340";
  t.style.color = "#fff";
  t.style.padding = "10px 18px";
  t.style.borderRadius = "5px";
  t.style.fontSize = "13px";
  t.style.zIndex = "999";
  t.style.boxShadow = "0 8px 24px rgba(0,0,0,0.25)";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

// ---------- data ----------
async function loadCases() {
  const { data, error } = await sb.from("legal_cases").select("*").order("updated_at", { ascending: false });
  if (error) { toast("Could not load cases: " + error.message, true); return; }
  let cases = data || [];

  // Pull each case's most recently logged "next action" date from its timeline,
  // so we can filter/display it on the list without changing the legal_cases table.
  const ids = cases.map(c => c.id);
  if (ids.length > 0) {
    const { data: hist, error: histErr } = await sb
      .from("case_stage_history")
      .select("case_id, next_action, next_action_date, date_entered, created_at")
      .in("case_id", ids)
      .order("date_entered", { ascending: true })
      .order("created_at", { ascending: true });
    if (!histErr && hist) {
      const latestByCase = {};
      hist.forEach(h => { latestByCase[h.case_id] = h; }); // ascending order, so last write = most recent entry
      cases = cases.map(c => ({
        ...c,
        next_action: latestByCase[c.id]?.next_action || null,
        next_action_date: latestByCase[c.id]?.next_action_date || null,
      }));
    }
  }

  state.cases = cases;
}

// Loads secured cases and attaches each one's most recent next action
// from secured_case_history (same approach as loadCases above).
async function loadSecuredCases() {
  const { data, error } = await sb.from("secured_cases").select("*").order("updated_at", { ascending: false });
  if (error) { toast("Could not load secured cases: " + error.message, true); return; }
  let rows = data || [];

  const ids = rows.map(r => r.id);
  if (ids.length > 0) {
    const { data: hist, error: histErr } = await sb
      .from("secured_case_history")
      .select("secured_case_id, next_action, next_action_date, date_entered, created_at")
      .in("secured_case_id", ids)
      .order("date_entered", { ascending: true })
      .order("created_at", { ascending: true });
    if (!histErr && hist) {
      const latest = {};
      hist.forEach(h => { latest[h.secured_case_id] = h; }); // ascending, so last write = most recent
      rows = rows.map(r => ({
        ...r,
        next_action: latest[r.id]?.next_action || null,
        next_action_date: latest[r.id]?.next_action_date || null,
      }));
    }
  }
  state.securedCases = rows;
}

function visibleCases() {
  const f = state.filters;
  return state.cases.filter((c) => {
    if (f.stage && c.case_stage !== f.stage) return false;
    if (f.state && c.case_current_state !== f.state) return false;
    if (f.createdFrom && (!c.when_created || c.when_created < f.createdFrom)) return false;
    if (f.createdTo && (!c.when_created || c.when_created > f.createdTo)) return false;
    if (f.nextActionFrom && (!c.next_action_date || c.next_action_date < f.nextActionFrom)) return false;
    if (f.nextActionTo && (!c.next_action_date || c.next_action_date > f.nextActionTo)) return false;
    if (f.search) {
      const s = f.search.toLowerCase();
      const hay = `${c.citation} ${c.customer_name || ""} ${c.legal_provision || ""} ${c.law_firm || ""} ${c.cause_of_action || ""} ${c.in_charge_counsel || ""} ${c.assigned_counsel || ""}`.toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });
}

// Updates just the table body, the "shown" count, and the summary stat cards
// (Total cases, Quantum, Fees, per-stage counts) to reflect the current
// filters — without touching the toolbar or any inputs, so the search box
// never loses focus (a full renderDashboard() would recreate the input).
function refreshTableOnly() {
  const rows = visibleCases();
  const tbody = document.getElementById("caseRows");
  const countEl = document.getElementById("shownCount");
  if (countEl) countEl.textContent = `${rows.length} of ${state.cases.length} shown`;
  if (tbody) {
    tbody.innerHTML = renderCaseRowsHtml(rows);
    wireCaseRowHandlers();
  }

  const { counts, totalQuantum, totalFees } = computeStats(rows);
  const totalEl = document.getElementById("statTotal");
  if (totalEl) totalEl.textContent = rows.length;
  const quantumEl = document.getElementById("statQuantum");
  if (quantumEl) quantumEl.textContent = money(totalQuantum);
  const feesEl = document.getElementById("statFees");
  if (feesEl) feesEl.textContent = money(totalFees);
  STAGES.filter(s => s !== "Archived").forEach(s => {
    const el = document.getElementById(`statStage-${cls(s)}`);
    if (el) el.textContent = counts[s] || 0;
  });
}

function computeStats(rows) {
  const counts = STAGES.reduce((acc, s) => { acc[s] = rows.filter(c => c.case_stage === s).length; return acc; }, {});
  const openCases = rows.filter(c => c.case_current_state !== "CASE CLOSED");
  const totalQuantum = openCases.reduce((sum, c) => sum + (Number(c.quantum) || 0), 0);
  const totalFees = openCases.reduce((sum, c) => sum + (Number(c.estimated_legal_fees) || 0), 0);
  return { counts, totalQuantum, totalFees };
}

function computeSecuredStats(rows) {

  const docCounts = DOC_AVAILABILITY.reduce((acc, d) => { acc[d] = rows.filter(c => c.documents_availability === d).length; return acc; }, {});

}

function visibleSecuredCases() {

function exportSecuredCasesToCSV(rows) {
  if (!rows || rows.length === 0) { toast("No secured cases to export with the current filters.", true); return; }
  const columns = [
    { key: "customer_name", header: "Customer Name" },
    { key: "loan_account_number", header: "Loan Account Number" },
    { key: "law_firm", header: "Law Firm" },
    { key: "quantum", header: "Quantum" },
    { key: "documents_availability", header: "Documents Availability" },
    { key: "next_action", header: "Next Action" },
    { key: "next_action_date", header: "Next Action Date" },
    { key: "comments", header: "Comments" },
    { key: "created_by_name", header: "Entered By" },
    { key: "last_updated_by_name", header: "Last Updated By" },
    { key: "updated_at", header: "Updated On" },
  ];
  const header = columns.map(c => c.header).map(csvEscape).join(",");
  const lines = rows.map(c => columns.map(col => csvEscape(c[col.key])).join(","));
  const csv = [header, ...lines].join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `secured_cases_export_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(`Exported ${rows.length} secured case(s) to CSV.`);
}

const SECURED_REQUIRED_FIELD_DEFS = [
  { id: "customer_name",          label: "Customer Name" },
  { id: "loan_account_number",    label: "Loan Account No." },
  { id: "law_firm",               label: "Law Firm" },
  { id: "quantum",                label: "Quantum" },
  { id: "documents_availability", label: "Documents Availability" },
];

function validateSecuredRequiredFields(prefix) {
  for (const f of SECURED_REQUIRED_FIELD_DEFS) {
    const el = document.getElementById(prefix + f.id);
    if (!el) continue;
    const val = (el.value || "").trim();
    if (!val) {
      el.focus();
      if (el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" });
      toast(`${f.label} is required.`, true);
      return false;
    }
  }
  return true;
}

const IMPORT_SECURED_HEADER_ALIASES = {
  "customer name": "customer_name",
  "customer_name": "customer_name",

  "loan account no": "loan_account_number",
  "loan account no.": "loan_account_number",

  "quantum": "quantum",
  "quantum (ugx)": "quantum",
  "documents availability": "documents_availability",
  "document availability": "documents_availability",
  "documents_availability": "documents_availability",
  "comments": "comments",
};

function mapRawRowToSecuredCase(rawRow) {
  const mapped = {};
  Object.keys(rawRow).forEach((rawHeader) => {
    const key = IMPORT_SECURED_HEADER_ALIASES[normalizeHeader(rawHeader)];
    if (!key) return;
    const rawVal = rawRow[rawHeader];
    if (key === "quantum") {
      mapped[key] = parseNumericField(rawVal);
    } else {
      const s = (rawVal ?? "").toString().trim();
      mapped[key] = s === "" ? null : s;
    }
  });
  return mapped;
}

function validateSecuredImportRow(mapped) {
  const errors = [];
  SECURED_REQUIRED_FIELD_DEFS.forEach((f) => {
    const v = mapped[f.id];
    if (v === null || v === undefined || v === "") errors.push(`${f.label} is required`);
  });
  if (mapped.documents_availability) {
    const match = DOC_AVAILABILITY.find(d => d.toLowerCase() === String(mapped.documents_availability).trim().toLowerCase());
    if (!match) {
      errors.push(`Documents Availability "${mapped.documents_availability}" doesn't match any of: ${DOC_AVAILABILITY.join(", ")}`);
    } else {
      mapped.documents_availability = match;
    }
  }
  if (mapped.law_firm) {
    const match = LAW_FIRMS.find(f => f.toLowerCase().trim() === String(mapped.law_firm).trim().toLowerCase());
    if (!match) {
      errors.push(`Law firm "${mapped.law_firm}" doesn't match any firm on file (check spelling/spacing exactly, or ask for it to be added)`);
    } else {
      mapped.law_firm = match;
    }
  }
  return errors;
}

// DB column keys (not form ids) for validating imported rows. Mirrors
// REQUIRED_FIELD_DEFS above but keyed to the actual legal_cases columns.
// Damages and Comments stay optional here too, matching the manual forms.
const REQUIRED_DB_FIELDS = [
  { key: "citation",           label: "Citation" },
  { key: "cause_of_action",    label: "Cause of action" },
  { key: "filing_date",        label: "Filing date" },

];

// Maps a normalized spreadsheet column header to the internal DB field key.
// Add more aliases here if staff use slightly different header wording.
const IMPORT_HEADER_ALIASES = {
  "citation": "citation",
  "customer name": "customer_name",
  "customer_name": "customer_name",
  "quantum": "quantum",
  "quantum (ugx)": "quantum",
  "loan account number": "legal_provision",
  "loan account no": "legal_provision",
  "loan account no.": "legal_provision",
  "account number": "legal_provision",
  "estimated legal fees": "estimated_legal_fees",
  "estimated legal fees (ugx)": "estimated_legal_fees",
  "damages": "damages",
  "damages (ugx)": "damages",
  "filing date": "filing_date",
  "filling date": "filing_date",
  "law firm": "law_firm",
  "cause of action": "cause_of_action",
  "case stage": "case_stage",
  "matter type": "matter_type",
  "cost center": "cost_center",
  "forum": "forum",
  "in charge counsel": "in_charge_counsel",
  "in-charge counsel": "in_charge_counsel",
  "assigned counsel": "assigned_counsel",
  "case category": "case_category",
  "case current state": "case_current_state",
  "when created": "when_created",
  "whencreated": "when_created",
  "comments": "comments",
};

function normalizeHeader(h) {
  return (h ?? "").toString().trim().toLowerCase().replace(/\s+/g, " ");
}

function excelDateToISO(val) {
  if (val == null || val === "") return null;
  if (val instanceof Date && !isNaN(val.getTime())) {
    const y = val.getFullYear(), m = String(val.getMonth() + 1).padStart(2, "0"), d = String(val.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  const s = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const parsed = new Date(s);
  if (!isNaN(parsed.getTime())) {
    const y = parsed.getFullYear(), m = String(parsed.getMonth() + 1).padStart(2, "0"), d = String(parsed.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  return null;
}

function parseNumericField(val) {
  if (val === null || val === undefined || val === "") return null;
  if (typeof val === "number") return val;
  const cleaned = String(val).replace(/[, ]+/g, "");
  const n = parseFloat(cleaned);
  return isNaN(n) ? null : n;
}

// Converts one raw spreadsheet row (object keyed by original header text)
// into a legal_cases-shaped object, using IMPORT_HEADER_ALIASES to match
// headers regardless of exact wording/casing.
function mapRawRowToCase(rawRow) {
  const mapped = {};
  Object.keys(rawRow).forEach((rawHeader) => {
    const key = IMPORT_HEADER_ALIASES[normalizeHeader(rawHeader)];
    if (!key) return; // unrecognized column, ignored
    const rawVal = rawRow[rawHeader];
    if (key === "filing_date" || key === "when_created") {
      mapped[key] = excelDateToISO(rawVal);
    } else if (key === "quantum" || key === "estimated_legal_fees" || key === "damages") {
      mapped[key] = parseNumericField(rawVal);
    } else {
      const s = (rawVal ?? "").toString().trim();
      mapped[key] = s === "" ? null : s;
    }
  });
  return mapped;
}

// Validates one mapped row; returns an array of human-readable error strings
// (empty array = valid). Normalizes case_stage against the known STAGES list.
function validateImportRow(mapped) {
  const errors = [];
  REQUIRED_DB_FIELDS.forEach((f) => {
    const v = mapped[f.key];
    if (v === null || v === undefined || v === "") errors.push(`${f.label} is required`);
  });
  if (mapped.case_stage) {
    const match = STAGES.find(s => s.toLowerCase() === String(mapped.case_stage).trim().toLowerCase());
    if (!match) {
      errors.push(`Case stage "${mapped.case_stage}" doesn't match any of: ${STAGES.join(", ")}`);
    } else {
      mapped.case_stage = match; // normalize to exact casing
    }
  }
  if (mapped.law_firm) {
    const match = LAW_FIRMS.find(f => f.toLowerCase().trim() === String(mapped.law_firm).trim().toLowerCase());
    if (!match) {
      errors.push(`Law firm "${mapped.law_firm}" doesn't match any firm on file (check spelling/spacing exactly, or ask for it to be added)`);
    } else {
      mapped.law_firm = match; // normalize to the exact stored spelling
    }
  }
  if (mapped.filing_date === null && mapped.filing_date !== undefined) {
    // excelDateToISO returned null from a non-empty, unparseable value
  }
  return errors;
}

  overlay.querySelector(".close-x").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.querySelector("#downloadTemplateBtn").onclick = downloadImportTemplate;

  let parsedRows = []; // [{ mapped, errors }]

  overlay.querySelector("#importFileInput").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let rawRows;
      try {
        const wb = XLSX.read(ev.target.result, { type: "array", cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        rawRows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      } catch (err) {
        toast("Could not read that file: " + err.message, true);
        return;
      }
      if (!rawRows || rawRows.length === 0) {
        toast("No rows found in that file.", true);
        return;
      }
      parsedRows = rawRows.map((raw) => {
        const mapped = mapRawRowToCase(raw);
        const errors = validateImportRow(mapped);
        return { mapped, errors };
      });
      renderImportPreview(overlay, parsedRows);
    };
    reader.onerror = () => toast("Could not read that file.", true);
    reader.readAsArrayBuffer(file);
  };

  overlay.querySelector("#cancelImportBtn").onclick = () => overlay.remove();

  overlay.querySelector("#confirmImportBtn").onclick = async () => {
    const validRows = parsedRows.filter(r => r.errors.length === 0);
    if (validRows.length === 0) { toast("No valid rows to import.", true); return; }
    const btn = overlay.querySelector("#confirmImportBtn");
    btn.disabled = true;
    btn.textContent = "Importing…";

    const payloads = validRows.map(r => ({
      ...r.mapped,
      created_by: state.user.id,
      created_by_name: state.user.full_name,
      last_updated_by_name: state.user.full_name,
    }));

    const { error } = await sb.from("legal_cases").insert(payloads);
    if (error) {
      toast("Import failed: " + error.message, true);
      btn.disabled = false;
      btn.textContent = "Import valid rows";
      return;
    }
    toast(`Imported ${validRows.length} case(s).`);
    overlay.remove();
    await loadCases();
    renderDashboard();
  };
}

function renderImportPreview(overlay, parsedRows) {
  const wrap = overlay.querySelector("#importPreviewWrap");
  const actionsRow = overlay.querySelector("#importActionsRow");
  const validCount = parsedRows.filter(r => r.errors.length === 0).length;
  const invalidCount = parsedRows.length - validCount;

  wrap.innerHTML = `
    <div class="section-label">Preview (${parsedRows.length} row${parsedRows.length === 1 ? "" : "s"} found — ${validCount} valid, ${invalidCount} with errors)</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Citation</th>
            <th>Customer Name</th>
            <th>Stage</th>
            <th>Filing Date</th>
            <th>Quantum</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${parsedRows.map((r, i) => `
            <tr>
              <td>${i + 1}</td>
              <td>${esc(r.mapped.citation || "—")}</td>
              <td>${esc(r.mapped.customer_name || "—")}</td>
              <td>${esc(r.mapped.case_stage || "—")}</td>
              <td>${esc(r.mapped.filing_date || "—")}</td>
              <td>${r.mapped.quantum != null ? money(r.mapped.quantum) : "—"}</td>
              <td>${r.errors.length === 0
                ? `<span style="color:var(--green);font-weight:600;">Valid</span>`
                : `<span style="color:var(--red);">${r.errors.map(esc).join("; ")}</span>`}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
  actionsRow.style.display = "flex";
  overlay.querySelector("#confirmImportBtn").textContent = `Import ${validCount} valid row${validCount === 1 ? "" : "s"}`;
  overlay.querySelector("#confirmImportBtn").disabled = validCount === 0;
}

      law_firm: document.getElementById("e_lawfirm").value.trim() || null,
      forum: document.getElementById("e_forum").value.trim() || null,
      in_charge_counsel: document.getElementById("e_incharge").value.trim() || null,
      assigned_counsel: document.getElementById("e_assigned").value.trim() || null,
      cost_center: document.getElementById("e_costcenter").value.trim() || null,
      when_created: document.getElementById("e_whencreated").value || null,
      comments: document.getElementById("e_comments").value.trim() || null,
      last_updated_by_name: state.user.full_name,
    };
    const { error } = await sb.from("legal_cases").update(payload).eq("id", c.id);
    if (error) { toast("Could not save changes: " + error.message, true); return; }

    const changes = buildChangeDiff(c, payload);
    if (Object.keys(changes).length > 0) {
      await sb.from("case_audit_log").insert({
        case_id: c.id,
        changed_by: state.user.id,
        changed_by_name: state.user.full_name,
        changes,
      });
    }

    overlay.remove();
    if (parentOverlay) parentOverlay.remove();
    toast("Case updated.");
    await loadCases();
    renderDashboard();
  };
}

// ---------- staff manager (admin only) ----------
async function loadUsers() {
  const { data, error } = await sb.from("app_users").select("id,username,full_name,role,created_at").order("created_at", { ascending: true });
  if (error) { toast("Could not load staff: " + error.message, true); return []; }
  return data || [];
}

async function openStaffManager() {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="drawer drawer-wide">
      <div class="drawer-head">
        <div><h3>Manage staff</h3><div class="acct-line">Create, edit, and remove staff accounts</div></div>
        <button class="close-x">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="actions-row">
          <button class="btn btn-gold" id="addStaffBtn">+ Add staff account</button>
        </div>
        <div class="section-label">Existing accounts</div>
        <div id="staffListWrap"><p style="color:var(--muted); font-size:13px;">Loading…</p></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector(".close-x").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.querySelector("#addStaffBtn").onclick = () => openAddStaffModal(overlay);

  await renderStaffList(overlay);
}

async function renderStaffList(overlay) {
  const users = await loadUsers();
  const wrap = overlay.querySelector("#staffListWrap");
  wrap.innerHTML = users.length === 0 ? `<p style="color:var(--muted); font-size:13px;">No accounts found.</p>` : `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Username</th><th>Full name</th><th>Role</th><th>Created</th><th></th></tr></thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td class="acct">${esc(u.username)}</td>
              <td>${esc(u.full_name)}</td>
              <td>
                <select data-id="${u.id}" class="roleSelect" ${u.username === state.user.username ? "disabled" : ""}>
                  ${["officer","manager","admin"].map(r => `<option value="${r}" ${r === u.role ? "selected" : ""}>${r}</option>`).join("")}
                </select>
              </td>
              <td>${fdate(u.created_at)}</td>
              <td style="white-space:nowrap;">
                <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-start;">
                  <button class="btn btn-ghost resetPwBtn" data-id="${u.id}" data-name="${esc(u.full_name)}" style="padding:4px 10px;font-size:12px;">Reset password</button>
                  ${u.username === state.user.username ? "" : `<button class="btn btn-danger deleteUserBtn" data-id="${u.id}" data-name="${esc(u.full_name)}" style="padding:4px 10px;font-size:12px;">Delete</button>`}
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

  wrap.querySelectorAll(".roleSelect").forEach(sel => {
    sel.onchange = async () => {
      const { error } = await sb.from("app_users").update({ role: sel.value }).eq("id", sel.dataset.id);
      if (error) { toast("Could not update role: " + error.message, true); return; }
      toast("Role updated.");
    };
  });

  wrap.querySelectorAll(".resetPwBtn").forEach(btn => {
    btn.onclick = () => openResetPasswordModal(btn.dataset.id, btn.dataset.name, overlay);
  });

  wrap.querySelectorAll(".deleteUserBtn").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm(`Remove account for ${btn.dataset.name}? This cannot be undone.`)) return;
      const { error } = await sb.from("app_users").delete().eq("id", btn.dataset.id);
      if (error) { toast("Could not delete account: " + error.message, true); return; }
      toast("Account removed.");
      await renderStaffList(overlay);
    };
  });
}

function openAddStaffModal(parentOverlay) {
  const overlay = document.createElement("div");
  overlay.className = "overlay center";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <div><h3>Add staff account</h3></div>
        <button class="close-x">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field"><label>Full name *</label><input id="ns_fullname" /></div>
        <div class="field"><label>Username *</label><input id="ns_username" placeholder="e.g. jbusiku" /></div>
        <div class="field"><label>Role</label>
          <select id="ns_role">
            <option value="officer">officer</option>
            <option value="manager">manager</option>
            <option value="admin">admin</option>
          </select>
        </div>
        <div class="field"><label>Password *</label><input type="text" id="ns_password" value="Stanbic@2026" /></div>
        <div class="actions-row">
          <button class="btn btn-primary" id="createStaffBtn">Create account</button>
          <button class="btn btn-ghost" id="cancelStaffBtn">Cancel</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector(".close-x").onclick = () => overlay.remove();
  overlay.querySelector("#cancelStaffBtn").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  overlay.querySelector("#createStaffBtn").onclick = async () => {
    const full_name = document.getElementById("ns_fullname").value.trim();
    const username = document.getElementById("ns_username").value.trim();
    const role = document.getElementById("ns_role").value;
    const password = document.getElementById("ns_password").value;
    if (!full_name || !username || !password) { toast("Full name, username and password are required.", true); return; }

    const password_hash = await sha256Hex(password);
    const { error } = await sb.from("app_users").insert({ username, password_hash, full_name, role });
    if (error) { toast("Could not create account: " + error.message, true); return; }
    overlay.remove();
    toast("Account created.");
    await renderStaffList(parentOverlay);
  };
}

function openResetPasswordModal(userId, userName, parentOverlay) {
  const overlay = document.createElement("div");
  overlay.className = "overlay center";
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <div><h3>Reset password</h3><div class="acct-line">${esc(userName)}</div></div>
        <button class="close-x">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field"><label>New password *</label><input type="text" id="rp_password" value="Stanbic@2026" /></div>
        <div class="actions-row">
          <button class="btn btn-primary" id="confirmResetBtn">Set password</button>
          <button class="btn btn-ghost" id="cancelResetBtn">Cancel</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector(".close-x").onclick = () => overlay.remove();
  overlay.querySelector("#cancelResetBtn").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  overlay.querySelector("#confirmResetBtn").onclick = async () => {
    const password = document.getElementById("rp_password").value;
    if (!password) { toast("Enter a new password.", true); return; }
    const password_hash = await sha256Hex(password);
    const { error } = await sb.from("app_users").update({ password_hash }).eq("id", userId);
    if (error) { toast("Could not reset password: " + error.message, true); return; }
    overlay.remove();
    toast("Password reset.");
    await renderStaffList(parentOverlay);
  };
}

init();

</script>
</body>
</html>
